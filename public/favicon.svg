<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCC84E" />
      <stop offset="100%" stop-color="#CFB53B" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>
  <!-- Background circle/hexagon -->
  <polygon points="32,2 60,16 60,48 32,62 4,48 4,16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Inner hexagon line -->
  <polygon points="32,6 56,18 56,46 32,58 8,46 8,18" fill="none" stroke="#CFB53B" stroke-opacity="0.3" stroke-width="1" />
  <!-- Text 'B' emblem -->
  <text x="32" y="44" font-family="'Rajdhani', 'Impact', 'Arial Black', sans-serif" font-size="36" font-weight="900" text-anchor="middle" fill="url(#goldGrad)">B</text>
</svg>